host: 0.0.0.0
port: 8090

turnstile:
  # WARNING These are the keys publicized by CF for testing; the real ones CANNOT be committed
  # to the repo so we'll have to figure out how to get them from ENV or secrets
  site_key: 1x00000000000000000000AA
  secret_key: 1x0000000000000000000000000000000A

backend: http://0.0.0.0:8080

default_action: pass

rules:
  - pattern: ~^/search/
    local: no
    action: check

  - pattern: ~highlight
    local: no
    action: check
    with_query: true

  - pattern: ~^/search
    local: no
    action: pass

  # don't mess with obvious support files
  - pattern: ~\.(jpg|png|gif|webm|js|css|svg|pdf|woff)$
    action: pass
  
  # allow search engines in
  - pattern: ~.
    search_engine: yes
    action: pass

  # non-search engine crawlers need to go away
  - pattern: ~.
    search_engine: no
    crawler: yes
    action: deny
