[supervisord]
nodaemon=true

[program:tomcat]
directory=/app
command=catalina.sh run
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:turnstile]
command=/app/newton_chymistry/turnstile-proxy/bin/turnstile_start
; Restart the proxy if it exits unexpectedly. Without this a dead turnstile leaves
; puma (and thus supervisord) running, so the pod looks healthy while serving nothing.
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
