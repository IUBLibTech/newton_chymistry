# Requires Docker Compose v2
name: newton_chymistry
services:
  app:
    build:
      context: .
    image: ghcr.io/iublibtech/newton_chymistry/newton_chymistry:latest
    env_file:
      - .docker.env
    volumes:
      - .:/app/newton_chymistry
      - ./p5:/app/newton_chymistry/p5
      - ./generate-init.sh:/app/generate-init.sh
      - ./tomcat/conf/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml
      - ./tomcat/conf/web.xml:/usr/local/tomcat/conf/web.xml
      - ./tomcat/conf/ROOT.xml:/usr/local/tomcat/conf/Catalina/localhost/ROOT.xml
    depends_on:
      - solr
    ports:
      - 8888:8080
    expose:
      - 8888
    command: ["catalina.sh", "run"]

  solr:
    image: solr:8.11
    env_file:
      - .docker.env
    command: solr-precreate newton_chymistry /opt/solr/server/configsets/newton_chymistry
    volumes:
      - solr_home:/var/solr/data
      - ./solr/conf:/opt/solr/server/configsets/newton_chymistry:ro
    ports:
      - 8983:8983
    expose:
      - 8983
    ulimits:
      nofile:
        soft: 65536
        hard: 524288

volumes:
  solr_home:


